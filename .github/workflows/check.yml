name: Site checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: check (${{ matrix.base }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base: ['/docs/', '/']
    env:
      SITE_BASE: ${{ matrix.base }}
      SITE_URL: https://hnmt.jp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm run validate
